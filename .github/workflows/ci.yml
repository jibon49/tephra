name: CI

on:
  push:
    branches: [main, "phase-*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - name: Resolve
        run: flutter pub get
      - name: Format
        run: dart format --output=none --set-exit-if-changed app/lib app/test packages tool
      - name: Analyze
        run: flutter analyze --fatal-infos
      - name: Licences
        run: dart run tool/check_licenses.dart --no-notices
      - name: l10n up to date
        run: |
          cd app
          flutter gen-l10n
          git diff --exit-code -- lib/l10n
      - name: Tool tests
        run: dart test tool/test
      - name: Package tests
        run: |
          for d in packages/*/; do
            if [ -n "$(find "$d" -path '*/test/*' -name '*_test.dart' -print -quit)" ]; then
              echo "== $d"
              if [ "$d" = "packages/tephra_sync/" ]; then
                (cd "$d" && dart test -x live)
              else
                (cd "$d" && dart test)
              fi
            fi
          done
      - name: App tests
        run: |
          cd app
          flutter test --exclude-tags golden
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: OAuth config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force secrets | Out-Null
          if ($env:CID) { @{TEPHRA_GOOGLE_ANDROID_SERVER_CLIENT_ID=$env:ASID; TEPHRA_GOOGLE_DESKTOP_CLIENT_ID=$env:CID; TEPHRA_GOOGLE_DESKTOP_CLIENT_SECRET=$env:CSEC} | ConvertTo-Json | Set-Content -Encoding utf8 secrets/google_oauth.json }
          else { Copy-Item secrets/google_oauth.example.json secrets/google_oauth.json }
        env:
          ASID: ${{ secrets.TEPHRA_GOOGLE_ANDROID_SERVER_CLIENT_ID }}
          CID: ${{ secrets.TEPHRA_GOOGLE_DESKTOP_CLIENT_ID }}
          CSEC: ${{ secrets.TEPHRA_GOOGLE_DESKTOP_CLIENT_SECRET }}
      - name: Build debug APK
        run: |
          cd app
          flutter build apk --debug --dart-define-from-file=../secrets/google_oauth.json
      - uses: actions/upload-artifact@v4
        with:
          name: tephra-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk

  windows:
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: OAuth config
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force secrets | Out-Null
          if ($env:CID) { @{TEPHRA_GOOGLE_ANDROID_SERVER_CLIENT_ID=$env:ASID; TEPHRA_GOOGLE_DESKTOP_CLIENT_ID=$env:CID; TEPHRA_GOOGLE_DESKTOP_CLIENT_SECRET=$env:CSEC} | ConvertTo-Json | Set-Content -Encoding utf8 secrets/google_oauth.json }
          else { Copy-Item secrets/google_oauth.example.json secrets/google_oauth.json }
        env:
          ASID: ${{ secrets.TEPHRA_GOOGLE_ANDROID_SERVER_CLIENT_ID }}
          CID: ${{ secrets.TEPHRA_GOOGLE_DESKTOP_CLIENT_ID }}
          CSEC: ${{ secrets.TEPHRA_GOOGLE_DESKTOP_CLIENT_SECRET }}
      - name: Build Windows release
        run: |
          cd app
          flutter build windows --release --dart-define-from-file=../secrets/google_oauth.json
      - uses: actions/upload-artifact@v4
        with:
          name: tephra-windows-release
          path: app/build/windows/x64/runner/Release/
